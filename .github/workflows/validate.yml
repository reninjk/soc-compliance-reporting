name: Validate Compliance Templates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: markdownlint "**/*.md" --ignore node_modules --config .markdownlint.json || true

  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.mlc_config.json'
        continue-on-error: true

  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files and folders exist
        run: |
          echo "=== Validating soc-compliance-reporting structure ==="

          # Required files
          REQUIRED_FILES=(
            "README.md"
            "checklists/nist-csf-audit.md"
            "metrics/soc-metrics-template.md"
            "reporting/weekly-report-template.md"
            "reporting/monthly-executive-summary.md"
          )

          PASS=true
          for f in "${REQUIRED_FILES[@]}"; do
            if [ -f "$f" ]; then
              echo "✅  $f"
            else
              echo "❌  MISSING: $f"
              PASS=false
            fi
          done

          if [ "$PASS" = false ]; then
            echo "Structure validation FAILED"
            exit 1
          fi
          echo "Structure validation PASSED"

      - name: Check templates contain required sections
        run: |
          echo "=== Checking template completeness ==="

          # Weekly report must have key sections
          grep -q "Week at a Glance" reporting/weekly-report-template.md && echo "✅  Weekly report: summary section found" || echo "⚠️   Weekly report: summary section missing"
          grep -q "Incidents Summary" reporting/weekly-report-template.md && echo "✅  Weekly report: incidents section found" || echo "⚠️   Weekly report: incidents section missing"

          # Monthly report must have exec overview and metrics
          grep -q "Executive Overview" reporting/monthly-executive-summary.md && echo "✅  Monthly report: exec overview found" || echo "⚠️   Monthly report: exec overview missing"
          grep -q "Decisions Required" reporting/monthly-executive-summary.md && echo "✅  Monthly report: decisions section found" || echo "⚠️   Monthly report: decisions section missing"

          # NIST checklist must have all functions
          for func in GOVERN IDENTIFY PROTECT DETECT RESPOND RECOVER; do
            grep -q "$func" checklists/nist-csf-audit.md && echo "✅  NIST checklist: $func found" || echo "❌  NIST checklist: $func MISSING"
          done

          # Metrics template must have MTTD/MTTR
          grep -q "MTTD" metrics/soc-metrics-template.md && echo "✅  Metrics: MTTD section found" || echo "⚠️   Metrics: MTTD section missing"
          grep -q "MITRE" metrics/soc-metrics-template.md && echo "✅  Metrics: MITRE coverage section found" || echo "⚠️   Metrics: MITRE coverage section missing"

          echo "Template validation complete."
