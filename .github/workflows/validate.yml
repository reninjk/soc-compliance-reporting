name: Validate Compliance Templates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Templates & Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          MISSING=0
          for f in README.md; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; MISSING=1; else echo "OK: $f"; fi
          done
          exit $MISSING

      - name: Validate YAML files
        run: |
          pip install pyyaml -q
          python3 -c "
          import os, sys, yaml
          errors = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for f in files:
                  if f.endswith(('.yml', '.yaml')):
                      path = os.path.join(root, f)
                      try:
                          yaml.safe_load(open(path))
                      except yaml.YAMLError as e:
                          errors.append(str(e))
          if errors:
              for e in errors: print('YAML ERROR:', e)
              sys.exit(1)
          print('All YAML files valid')
          "

      - name: Check markdown files are non-empty
        continue-on-error: true
        run: |
          EMPTY=0
          find . -name "*.md" -not -path "./.git/*" | while read f; do
            SIZE=$(wc -c < "$f")
            if [ "$SIZE" -lt 10 ]; then echo "WARN: very small file: $f ($SIZE bytes)"; fi
          done
          echo "Markdown check complete"
